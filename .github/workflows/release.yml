name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.GOARCH }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - GOOS: linux
            GOARCH: amd64
          - GOOS: linux
            GOARCH: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download dependencies
        run: go mod download

      - name: Build
        env:
          GOOS: ${{ matrix.GOOS }}
          GOARCH: ${{ matrix.GOARCH }}
        run: |
          mkdir -p dist
          go build \
            -ldflags "-X main.version=${{ github.ref_name }}" \
            -o dist/termique-agent-linux-${{ matrix.GOARCH }} \
            .

      - name: Checksum
        run: sha256sum dist/termique-agent-linux-${{ matrix.GOARCH }} > dist/termique-agent-linux-${{ matrix.GOARCH }}.sha256

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/termique-agent-linux-${{ matrix.GOARCH }}
            dist/termique-agent-linux-${{ matrix.GOARCH }}.sha256
